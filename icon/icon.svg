<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD3E2"/>
      <stop offset="1" stop-color="#FFE8CF"/>
    </linearGradient>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5A3A34"/>
      <stop offset="1" stop-color="#3E2724"/>
    </linearGradient>
    <g id="heart"><path d="M0 -25 C-25 -60 -75 -35 -50 5 L0 50 L50 5 C75 -35 25 -60 0 -25 Z"/></g>
    <g id="spark"><path d="M0 -30 Q4 -4 30 0 Q4 4 0 30 Q-4 4 -30 0 Q-4 -4 0 -30 Z"/></g>
  </defs>

  <rect width="1000" height="1000" fill="url(#bg)"/>
  <circle cx="500" cy="560" r="330" fill="#FFFFFF" opacity="0.45"/>

  <!-- floating hearts & sparkles -->
  <use href="#heart" transform="translate(735 250) rotate(14) scale(1.15)" fill="#FF6F91"/>
  <use href="#heart" transform="translate(825 370) rotate(20) scale(0.6)" fill="#FF9DB5"/>
  <use href="#heart" transform="translate(250 300) rotate(-16) scale(0.55)" fill="#FF9DB5"/>
  <use href="#spark" transform="translate(640 170) scale(0.8)" fill="#FFFFFF"/>
  <use href="#spark" transform="translate(190 450) scale(0.6)" fill="#FFFFFF"/>
  <use href="#spark" transform="translate(830 520) scale(0.5)" fill="#FFC94D"/>

  <!-- neck -->
  <rect x="458" y="600" width="84" height="140" rx="30" fill="#F4C3A3"/>
  <!-- ears -->
  <ellipse cx="358" cy="470" rx="22" ry="34" fill="#F4C3A3"/>
  <ellipse cx="642" cy="470" rx="22" ry="34" fill="#F4C3A3"/>

  <!-- body / top -->
  <path d="M215 1000 C215 815 330 725 500 720 C670 725 785 815 785 1000 Z" fill="#9C8CF0"/>
  <path d="M215 1000 C215 815 330 725 500 720 C670 725 785 815 785 1000" fill="none" stroke="#8573E6" stroke-width="0"/>

  <!-- long hair (back view) -->
  <path d="M500 280 C398 280 356 360 360 455 C364 565 350 690 326 805
           C318 850 352 878 392 862 C420 885 462 880 486 864
           C512 882 556 884 580 864 C612 882 662 872 674 840
           C684 812 652 690 640 565 C636 520 640 490 640 455
           C644 360 602 280 500 280 Z" fill="url(#hair)"/>
  <!-- hair strands -->
  <path d="M455 330 C420 450 425 640 412 830" fill="none" stroke="#2F1D1B" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
  <path d="M545 330 C580 450 576 640 590 830" fill="none" stroke="#2F1D1B" stroke-width="7" stroke-linecap="round" opacity="0.45"/>
  <path d="M500 520 C498 640 500 740 506 850" fill="none" stroke="#2F1D1B" stroke-width="6" stroke-linecap="round" opacity="0.35"/>
  <!-- shine -->
  <path d="M415 345 Q500 300 585 345" fill="none" stroke="#8A635A" stroke-width="16" stroke-linecap="round"/>

  <!-- ribbon -->
  <g transform="translate(500 470)">
    <path d="M-10 18 L-46 92 L-20 82 L-6 104 L4 24 Z" fill="#E8557A"/>
    <path d="M10 18 L46 92 L20 82 L6 104 L-4 24 Z" fill="#E8557A"/>
    <path d="M0 0 C-40 -50 -105 -40 -92 8 C-82 50 -30 36 0 0 Z" fill="#FF6F91"/>
    <path d="M0 0 C40 -50 105 -40 92 8 C82 50 30 36 0 0 Z" fill="#FF6F91"/>
    <path d="M-12 -2 C-35 -26 -70 -24 -72 2" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
    <path d="M12 -2 C35 -26 70 -24 72 2" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
    <circle r="20" fill="#E8557A"/>
  </g>
</svg>
